ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    DirectoryIndex index.html
    CGIPassAuth On
    Require all granted

    <FilesMatch "(^\.|^config(?:\.example)?\.js$|\.(?:bak|log|ini|sh)$)">
        Require all denied
    </FilesMatch>
</Directory>

<LocationMatch "^/(?:\.|scripts(?:/|$)|docker(?:/|$))">
    Require all denied
</LocationMatch>