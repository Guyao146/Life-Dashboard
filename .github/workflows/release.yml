name: Publish release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-release:
    name: Package and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="Life-Dashboard-v${version}.zip"
          git archive \
            --format=zip \
            --prefix="Life-Dashboard-v${version}/" \
            "${GITHUB_REF_NAME}" \
            -o "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Life-Dashboard-v*.zip
            Life-Dashboard-v*.zip.sha256