<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>连接网关 · 生活中枢</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f5;color:#1c2622;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    .cb-card{max-width:480px;width:calc(100% - 48px);padding:36px 32px;border-radius:16px;background:#fff;border:1px solid #dbe5df;box-shadow:0 14px 44px rgba(20,40,30,.1);text-align:center}
    .cb-mark{font-size:34px;line-height:1}
    h1{font-size:20px;margin:14px 0 6px}
    #cb-status{margin:0;color:#5a6b62}
    #cb-error{margin:12px 0 0;color:#b42318;font-size:14px}
    .cb-error:empty{display:none}
    .cb-actions{margin-top:26px}
    .cb-actions a{display:inline-block;padding:11px 22px;border-radius:9px;background:#89e0b0;color:#10312a;text-decoration:none;font-weight:600}
    @media (prefers-color-scheme: dark){body{background:#0d1411;color:#e8f0eb}.cb-card{background:#16211c;border-color:#2a3630;box-shadow:0 14px 44px rgba(0,0,0,.35)}#cb-status{color:#9db0a5}#cb-error{color:#ff9a8a}.cb-actions a{background:#89e0b0;color:#0b241d}}
  </style>
</head>
<body>
  <main class="cb-card">
    <div class="cb-mark" aria-hidden="true">❀</div>
    <h1>正在连接 Sakura-AI-Gateway</h1>
    <p id="cb-status">正在处理授权回调…</p>
    <p id="cb-error" class="cb-error" role="alert"></p>
    <div class="cb-actions"><a href="/">返回生活看板</a></div>
  </main>
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var status = document.getElementById('cb-status');
    var error = document.getElementById('cb-error');
    function fail(message) { error.textContent = message; status.textContent = '连接失败'; }

    var pending = null;
    try { pending = JSON.parse(localStorage.getItem('life-hub-gateway-pending') || 'null'); } catch (parseError) { pending = null; }
    try { localStorage.removeItem('life-hub-gateway-pending'); } catch (storageError) { /* 忽略 */ }
    if (!pending) { fail('未找到正在进行的网关连接，请回到看板重新发起'); return; }

    // state 与签发方必须与发起连接时一致，防止伪造或串用其他授权服务。
    if (params.get('state') !== pending.state) { fail('回调校验失败：state 不匹配，请重新发起连接'); return; }
    if (params.get('iss') && params.get('iss') !== pending.issuer) { fail('回调不是由发起连接的网关返回'); return; }
    if (params.get('error')) { fail('网关拒绝了授权：' + (params.get('error_description') || params.get('error'))); return; }
    var code = params.get('code');
    if (!code) { fail('回调缺少授权码，请重新发起连接'); return; }

    var body = new URLSearchParams({
      grant_type: 'authorization_code',
      client_id: pending.clientId || 'auto',
      redirect_uri: pending.redirectUri,
      code_verifier: pending.verifier,
      code: code
    });
    fetch(pending.tokenEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' }, body: body })
      .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok || !result.data || !result.data.access_token) {
          throw new Error((result.data && (result.data.error_description || result.data.error)) || ('令牌接口返回 HTTP ' + '失败'));
        }
        var auth = {
          issuer: pending.issuer,
          clientId: result.data.client_id || pending.clientId || '',
          accessToken: result.data.access_token,
          refreshToken: result.data.refresh_token || '',
          accessExpiresAt: Date.now() + (result.data.expires_in || 3600) * 1000,
          model: ''
        };
        try { localStorage.setItem('life-hub-gateway-auth', JSON.stringify(auth)); } catch (storageError) { throw new Error('浏览器阻止了保存网关连接'); }
        status.textContent = '连接成功，正在返回看板';
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'life-hub-gateway-connected' }, location.origin);
          setTimeout(function () { window.close(); }, 500);
        } else {
          setTimeout(function () { location.href = '/'; }, 700);
        }
      })
      .catch(function (err) { fail(err.message === 'Failed to fetch' ? '无法连接网关令牌接口，请检查网络后重试' : err.message); });
  })();
  </script>
</body>
</html>
